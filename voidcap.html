<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOIDCAP — Channel Identity</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #080808;
    --accent: #C8F542;
    --white: #F5F5F0;
    --grey: #1a1a1a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 80px;
    padding: 60px 20px;
  }

  /* ── HEADER ── */
  .page-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.4em;
    color: var(--accent);
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.2s;
  }

  /* ── MAIN LOGO CARD ── */
  .logo-card {
    width: 520px;
    aspect-ratio: 1;
    background: #0e0e0e;
    border: 1px solid #1f1f1f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    position: relative;
    overflow: hidden;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards 0.4s;
  }

  .logo-card::before {
    content: '';
    position: absolute;
    top: -1px; left: -1px; right: -1px;
    height: 2px;
    background: var(--accent);
  }

  /* corner marks */
  .logo-card::after {
    content: '';
    position: absolute;
    bottom: 20px; right: 20px;
    width: 18px; height: 18px;
    border-right: 1px solid #2a2a2a;
    border-bottom: 1px solid #2a2a2a;
  }

  .corner-tl {
    position: absolute;
    top: 20px; left: 20px;
    width: 18px; height: 18px;
    border-left: 1px solid #2a2a2a;
    border-top: 1px solid #2a2a2a;
  }

  /* ── ICON MARK ── */
  .icon-mark {
    position: relative;
    width: 110px;
    height: 110px;
  }

  .icon-mark svg {
    width: 100%;
    height: 100%;
  }

  /* ── WORDMARK ── */
  .wordmark {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .wordmark-main {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 88px;
    letter-spacing: 0.18em;
    color: var(--white);
    line-height: 1;
  }

  .wordmark-main span {
    color: var(--accent);
  }

  .wordmark-sub {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    font-weight: 300;
    letter-spacing: 0.55em;
    color: #444;
    text-transform: uppercase;
    margin-left: 0.55em; /* offset for letter-spacing */
  }

  /* ── DIVIDER ── */
  .divider {
    width: 48px;
    height: 1px;
    background: var(--accent);
    opacity: 0.5;
  }

  /* ── TAGLINE ── */
  .tagline {
    font-size: 9px;
    letter-spacing: 0.35em;
    color: #333;
    text-transform: uppercase;
    margin-left: 0.35em;
  }

  /* ── VARIANTS ROW ── */
  .variants {
    display: flex;
    gap: 24px;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards 0.7s;
  }

  .variant-card {
    width: 200px;
    height: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    border: 1px solid #1a1a1a;
    position: relative;
  }

  .variant-card.light {
    background: var(--white);
  }

  .variant-card.dark {
    background: var(--black);
  }

  .variant-card.accent-bg {
    background: var(--accent);
  }

  .v-label {
    position: absolute;
    bottom: 10px;
    font-size: 8px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }

  .variant-card.light .v-label { color: #aaa; }
  .variant-card.dark .v-label { color: #333; }
  .variant-card.accent-bg .v-label { color: #3a4a10; }

  /* variant wordmarks */
  .v-word {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 38px;
    letter-spacing: 0.15em;
    line-height: 1;
  }

  .variant-card.light .v-word { color: var(--black); }
  .variant-card.dark .v-word { color: var(--white); }
  .variant-card.accent-bg .v-word { color: var(--black); }

  .v-word .hi { color: var(--accent); }
  .variant-card.light .v-word .hi { color: var(--black); }
  .variant-card.accent-bg .v-word .hi { color: var(--black); }

  /* ── CHANNEL ART STRIP ── */
  .banner-section {
    width: 520px;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards 0.9s;
  }

  .banner-label {
    font-size: 8px;
    letter-spacing: 0.4em;
    color: #333;
    text-transform: uppercase;
    margin-bottom: 12px;
    margin-left: 2px;
  }

  .banner {
    width: 100%;
    height: 120px;
    background: #0a0a0a;
    border: 1px solid #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 36px;
    position: relative;
    overflow: hidden;
  }

  .banner::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
  }

  .banner-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 52px;
    letter-spacing: 0.2em;
    color: var(--white);
  }

  .banner-name em {
    color: var(--accent);
    font-style: normal;
  }

  .banner-meta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 5px;
  }

  .banner-meta span {
    font-size: 8px;
    letter-spacing: 0.3em;
    color: #2e2e2e;
    text-transform: uppercase;
  }

  .banner-meta .active {
    color: var(--accent);
  }

  /* bg grid lines */
  .grid-bg {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(200,245,66,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200,245,66,0.03) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* icon animation */
  .ring-outer {
    animation: rotateSlow 12s linear infinite;
    transform-origin: center;
  }

  @keyframes rotateSlow {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .accent-dot {
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.4; }
  }
</style>
</head>
<body>

<p class="page-label">VOIDCAP — Channel Identity System</p>

<!-- PRIMARY LOGO -->
<div class="logo-card">
  <div class="corner-tl"></div>
  <div class="grid-bg"></div>

  <!-- Icon mark: abstract void/capital symbol -->
  <div class="icon-mark">
    <svg viewBox="0 0 110 110" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- outer dashed ring -->
      <circle class="ring-outer" cx="55" cy="55" r="50" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="4 6"/>
      <!-- middle ring -->
      <circle cx="55" cy="55" r="38" stroke="#222" stroke-width="1"/>
      <!-- inner solid ring -->
      <circle cx="55" cy="55" r="26" stroke="#2a2a2a" stroke-width="1.5"/>
      <!-- center void fill -->
      <circle cx="55" cy="55" r="14" fill="#C8F542" opacity="0.08"/>
      <!-- cross hairs -->
      <line x1="55" y1="17" x2="55" y2="29" stroke="#1d1d1d" stroke-width="1"/>
      <line x1="55" y1="81" x2="55" y2="93" stroke="#1d1d1d" stroke-width="1"/>
      <line x1="17" y1="55" x2="29" y2="55" stroke="#1d1d1d" stroke-width="1"/>
      <line x1="81" y1="55" x2="93" y2="55" stroke="#1d1d1d" stroke-width="1"/>
      <!-- center V mark -->
      <polyline points="44,48 55,64 66,48" stroke="#C8F542" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- accent dot top -->
      <circle class="accent-dot" cx="55" cy="17" r="2.5" fill="#C8F542"/>
    </svg>
  </div>

  <!-- Wordmark -->
  <div class="wordmark">
    <div class="wordmark-main">VOID<span>CAP</span></div>
    <div class="wordmark-sub">Finance · Wealth · Growth</div>
  </div>

  <div class="divider"></div>
  <div class="tagline">The anonymous money channel</div>
</div>

<!-- VARIANTS -->
<div class="variants">
  <!-- Dark -->
  <div class="variant-card dark">
    <svg width="42" height="42" viewBox="0 0 110 110" fill="none">
      <circle cx="55" cy="55" r="38" stroke="#2a2a2a" stroke-width="1"/>
      <circle cx="55" cy="55" r="14" fill="#C8F542" opacity="0.1"/>
      <polyline points="44,48 55,64 66,48" stroke="#C8F542" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="55" cy="17" r="3" fill="#C8F542"/>
    </svg>
    <div class="v-word">VOID<span class="hi">CAP</span></div>
    <div class="v-label">Dark</div>
  </div>

  <!-- Light -->
  <div class="variant-card light">
    <svg width="42" height="42" viewBox="0 0 110 110" fill="none">
      <circle cx="55" cy="55" r="38" stroke="#ccc" stroke-width="1"/>
      <circle cx="55" cy="55" r="14" fill="#080808" opacity="0.08"/>
      <polyline points="44,48 55,64 66,48" stroke="#080808" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="55" cy="17" r="3" fill="#080808"/>
    </svg>
    <div class="v-word">VOID<span>CAP</span></div>
    <div class="v-label">Light</div>
  </div>

  <!-- Accent -->
  <div class="variant-card accent-bg">
    <svg width="42" height="42" viewBox="0 0 110 110" fill="none">
      <circle cx="55" cy="55" r="38" stroke="#3a4a10" stroke-width="1"/>
      <circle cx="55" cy="55" r="14" fill="#080808" opacity="0.12"/>
      <polyline points="44,48 55,64 66,48" stroke="#080808" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="55" cy="17" r="3" fill="#080808"/>
    </svg>
    <div class="v-word">VOID<span>CAP</span></div>
    <div class="v-label">Accent</div>
  </div>
</div>

<!-- BANNER PREVIEW -->
<div class="banner-section">
  <div class="banner-label">Channel Banner Preview</div>
  <div class="banner">
    <div class="grid-bg"></div>
    <div class="banner-name">VOID<em>CAP</em></div>
    <div class="banner-meta">
      <span class="active">▶ New videos weekly</span>
      <span>Finance · Wealth · Growth</span>
      <span>Anonymous · Unfiltered</span>
    </div>
  </div>
</div>

</body>
</html>
